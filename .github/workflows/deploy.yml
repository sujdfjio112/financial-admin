name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop

# 取消重复运行，避免并发推送导致排队等待
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CI: 'true'
  # 关闭 sourcemap 减少 I/O（需要 sourcemap 时删掉或设为 true）
  VITE_SOURCEMAP: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 'Restore cache: node_modules + vite'
        uses: actions/cache@v4
        with:
          # 使用 package-lock.json 做 key，vite.config 文件改动也会刷新缓存
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json','**/vite.config.*') }}-v1
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-node-
          path: |
            ~/.npm
            node_modules
            .vite
            node_modules/.vite

      - name: Install dependencies (fast)
        # prefer-offline 先用本地缓存、no-audit/no-fund 跳过额外开销、silent 减少日志量
        run: npm ci --prefer-offline --no-audit --no-fund --silent

      - name: Prebuild deps cache (optional, speeds up Vite prebundle)
        # 该步会触发 Vite 的依赖预构建（esbuild），使得后续构建更快并把缓存写入 .vite
        # 如不想额外步骤可删除此 step，通常能减少总耗时（取决项目）
        run: npx vite --version >/dev/null && npx vite build --ssr manifest --emptyOutDir=false || echo "skip prebuild"

      - name: Build
        run: npm run build --if-present --silent

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
