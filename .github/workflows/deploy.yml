name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop

# 取消重复运行，避免并发推送导致排队等待
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CI: 'true'
  # 关闭 sourcemap 减少 I/O（需要 sourcemap 时删掉或设为 true）
  VITE_SOURCEMAP: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ./dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 'Restore cache: node_modules + vite'
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json','**/vite.config.*') }}-v1
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-node-
          path: |
            ~/.npm
            node_modules
            .vite
            node_modules/.vite

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --silent

      - name: Build project
        run: npm run build --if-present --silent

      - name: Verify build
        run: |
          if [ ! -f ./dist/index.html ]; then
            echo "Build failed: index.html not found in ./dist"
            exit 1
          fi

      - name: Copy index -> 404 (for SPA)
        run: node scripts/copy-index-to-404.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages # ✅ 绑定环境，显示流程图
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4 # ✅ 官方部署 Action
