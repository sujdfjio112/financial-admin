name: Deploy to GitHub Pages (Vite + pnpm)

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CI: 'true'
  VITE_SOURCEMAP: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -------------------------
      # 🔥 必须：先启用 corepack 才能让 pnpm 可执行
      # -------------------------
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm -v

      # -------------------------
      # setup-node 现在就不会报 pnpm not found
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore caches
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml','**/vite.config.*') }}-v1
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-pnpm-
          path: |
            ~/.pnpm-store
            node_modules
            .vite
            node_modules/.vite

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --offline || pnpm install --frozen-lockfile

      - name: Build (Vite)
        run: pnpm run build --silent

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
