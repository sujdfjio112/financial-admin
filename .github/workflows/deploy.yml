name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 可选定时触发

# 取消重复运行，避免并发推送导致排队等待
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CI: 'true'
  # 关闭 sourcemap 减少 I/O（需要 sourcemap 时删掉或设为 true）
  VITE_SOURCEMAP: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ./dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 'Restore cache: node_modules + vite'
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json','**/vite.config.*') }}-v1
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-node-
          path: |
            ~/.npm
            node_modules
            .vite
            node_modules/.vite

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --silent

      - name: Get package version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Build project
        run: npm run build --if-present --silent

      - name: Verify build
        run: |
          if [ ! -f ./dist/index.html ]; then
            echo "Build failed: index.html not found in ./dist"
            exit 1
          fi

      - name: Copy index -> 404 (for SPA)
        run: node scripts/copy-index-to-404.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  report-build-status:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Report build status
        uses: actions/github-script@v6
        with:
          script: |
            console.log("Build successful. Pages artifact ready for deploy.")

  deploy:
    # needs: [build, report-build-status]
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'github-pages' || 'github-pages-auto' }}
    steps:
      - name: Wait for scheduled release (if versioned)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name != 'push'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION || 'dev';
            const scheduleFile = './release-schedule.json';
            if (!fs.existsSync(scheduleFile)) {
              console.log('No release schedule, deploy immediately');
              return;
            }
            const schedule = JSON.parse(fs.readFileSync(scheduleFile, 'utf-8'));
            if (!(version in schedule)) {
              console.log('Version not in schedule, deploy immediately');
              return;
            }
            const releaseTime = new Date(schedule[version]);
            const now = new Date();
            const diff = releaseTime - now;
            if (diff > 0) {
              console.log(`Waiting ${diff}ms until scheduled release for version ${version}`);
              await new Promise(resolve => setTimeout(resolve, diff));
            }

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

      - name: Print deployment info to workflow summary
        uses: actions/github-script@v6
        with:
          script: |
            const version = process.env.VERSION || 'dev';
            const pageUrl = '${{ steps.deploy-pages.outputs.page_url }}';

            // 打印到 logs
            console.log("## Deployment Info\n- Version: " + version + "\n- Pages URL: " + pageUrl);

            // 输出到 workflow summary
            const fs = require('fs');
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              "## Deployment Info\n- Version: " + version + "\n- Pages URL: " + pageUrl + "\n"
            );
