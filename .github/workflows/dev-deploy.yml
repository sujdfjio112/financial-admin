name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本"
        required: false
        default: dev

env:
  REGISTRY: crpi-4gjhfmn9d3r2c9et.cn-hangzhou.personal.cr.aliyuncs.com
  NAMESPACE: financial-admin
  IMAGE_NAME: finacial-admin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Login ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login $REGISTRY \
          --username ${{ secrets.ACR_USERNAME }} \
          --password-stdin

      - name: Build Image
        run: |
          docker build -t $REGISTRY/$NAMESPACE/$IMAGE_NAME:$IMAGE_TAG .

      - name: Push Image
        run: |
          docker push $REGISTRY/$NAMESPACE/$IMAGE_NAME:$IMAGE_TAG

      - name: Print Image URL
        run: |
          echo "Image pushed:"
          echo "$REGISTRY/$NAMESPACE/$IMAGE_NAME:$IMAGE_TAG"